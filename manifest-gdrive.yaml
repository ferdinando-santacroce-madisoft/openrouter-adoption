schema_version: 1

manifest:
  id: openrouter-gdrive
  title: "Manifest di sincronizzazione dei documenti OpenRouter con Google Drive"
  created_at: "2026-09-25"
  owner: Nando
  status: approved
  purpose: >-
    Governare la pubblicazione e la sincronizzazione bidirezionale dei documenti
    della selezione software OpenRouter verso i Google Docs della cartella
    "Adozione OpenRouter" (account work). Git resta la sorgente di verita dei
    contenuti; i Google Docs sono la vista collaborativa aziendale. Le modifiche
    esterne al corpo dei documenti vengono intercettate dal drift check prima di
    ogni push.
  source_root: .
  canonical_sources:
    openrouter_documents:
      system: git
      location: contenuti
      rule: >-
        Il contenuto gestito dal repository si modifica localmente, si verifica e
        poi si pubblica. Nei Google Docs si raccolgono commenti e feedback, non
        modifiche concorrenti al corpo dei documenti managed-from-git.
  published_read_model:
    system: gdrive
    rule: >-
      I Google Docs sono la vista collaborativa aziendale dei documenti di
      selezione software, non una seconda fonte dei dati.

gdrive:
  account: work
  base_folder:
    id: "1bGRMC7V0k2kfulbsC-IUWVdOoYsVfUT1"
    name: "Adozione OpenRouter"
    url: "https://drive.google.com/drive/folders/1bGRMC7V0k2kfulbsC-IUWVdOoYsVfUT1"
  verified_at: "2026-09-25"
  verified_with: gws-0.22.5

publication_policy:
  default_mime_type: application/vnd.google-apps.document
  import_format: text/markdown
  write_guard: >-
    Ogni create, update, move, delete o modifica di permessi su Google Drive
    richiede autorizzazione esplicita preventiva di Nando sul comando gws e sui
    target.
  managed_doc_editing: >-
    I documenti con label managed-from-git si aggiornano dal repository. I
    colleghi propongono modifiche con commenti; i commenti vanno letti e
    recepiti nel markdown locale prima di un push (la sostituzione totale del
    corpo puo' far perdere gli anchor dei commenti).
  update_protocol:
    - detect_external_drift
    - read_current_markdown_and_comments
    - prepare_markdown_file
    - show_exact_gws_command_and_targets
    - obtain_nando_authorization
    - push_with_fresh_baseline
    - read_back_and_verify
    - record_file_id_version_date_and_hash
  dispositions:
    push: documento canonico pubblicabile dopo il gate indicato
    local_only: artefatto operativo o editoriale che resta locale
    publish_hold: documento destinato a Drive ma non pubblicato per ora (escluso da gen-md --all e dal drift check)

transformation_rules:
  title:
    - Il titolo e' il nome del Google Doc, separato dal corpo.
    - Rimuovere dal corpo l'H1 locale che ripete il titolo.
  links:
    - Riscrivere i link relativi fra i documenti in URL Google Docs assoluti dei file_id registrati nel manifest.
    - Correggere o bloccare i link semanticamente invalidi prima della pubblicazione.
  markdown:
    - L'import markdown di Google Docs supporta titoli, grassetto, liste, task list e tabelle.
    - Le sezioni racchiuse tra "CONFLUENCE-LOCAL-ONLY" e "/CONFLUENCE-LOCAL-ONLY" sono interne al repository e non si pubblicano.
  comments:
    - I commenti aperti vanno letti con `gws drive comments list` e recepiti nel markdown locale prima del push.

labels:
  global:
    - openrouter
    - managed-from-git

target_hierarchy:
  base_folder:
    title: "Adozione OpenRouter"
    file_id: "1bGRMC7V0k2kfulbsC-IUWVdOoYsVfUT1"
    parent_ref: null
    status: existing

batches:
  openrouter_managed_docs:
    order: 0
    goal: "Sincronizzazione dei documenti della selezione software OpenRouter con la cartella Google Drive."
    gate: local_content_approved_by_nando

